<svg xmlns="http://www.w3.org/2000/svg" width="960" height="64" viewBox="0 0 960 64" role="img" aria-labelledby="title">
  <title id="title">building mobile apps and exploring how to evaluate AI</title>
  <style>
    .reveal { animation: reveal 3.8s steps(53, end) 250ms both; }
    .caret { animation: move 3.8s steps(53, end) 250ms both, blink 1s step-end infinite; }
    @keyframes reveal { from { width: 0; } to { width: 795px; } }
    @keyframes move { from { transform: translateX(0); } to { transform: translateX(795px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: none; }
      .caret { display: none; }
    }
  </style>
  <defs><clipPath id="typing"><rect class="reveal" x="92" y="0" width="795" height="64"/></clipPath></defs>
