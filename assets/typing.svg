  <g fill="#ffe486" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="25">
    <text x="57" y="41">›</text>
    <text x="92" y="41" textLength="795" lengthAdjust="spacingAndGlyphs" clip-path="url(#typing)">building mobile apps and exploring how to evaluate AI</text>
    <rect class="caret" x="94" y="22" width="3" height="22" rx="1"/>
  </g>
</svg>
